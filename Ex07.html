<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form thông tin sở thích</title>
    <style>
    .item{
        display: inline-block;
        width: 100px;
    }
</style>
</head>
<body>
    <h1>SỞ THÍCH CỦA BẠN</h1>
    <form action="" method="post">
        <p>
        <label for="name">Họ và tên</label>
        <input type="text" id="name" name="Họ và tên">
        </p>
        <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="Email">
        </p>
        <span class="title">Sở thích</span>
        <div class="hobby-group">
            <div>
                <span class="item">
                    <input type="checkbox" id="sport" name="Sở thích" value="Thể thao">
                    <label for="sport">Thể thao</label>
                </span>

                <span class="item">
                    <input type="checkbox" id="music" name="Sở thích" value="Âm nhạc">
                    <label for="music">Âm nhạc</label>
                </span>

                <span class="item">
                    <input type="checkbox" id="book" name="Sở thích" value="Đọc sách">
                    <label for="book">Đọc sách</label>
                </span>
            </div>

            <div>
                <span class="item">
                    <input type="checkbox" id="web" name="Sở thích" value="Lướt web">
                    <label for="web">Lướt web</label>
                </span>

                <span class="item">
                    <input type="checkbox" id="game" name="Sở thích" value="Chơi game">
                    <label for="game">Chơi game</label>
                </span>

                <span class="item">
                    <input type="checkbox" id="movie" name="Sở thích" value="Điện ảnh">
                    <label for="movie">Điện ảnh</label>
                </span>
            </div>

            <div>
                <span class="item">
                    <input type="checkbox" id="travel" name="Sở thích" value="Du lịch">
                    <label for="travel">Du lịch</label>
                </span>
            </div>
        </div>
        <p>
        <button type="submit">Gửi thông tin</button>
        <button type="reset">Nhập lại</button>
        </p>
    </form>
    
</body>
</html>
