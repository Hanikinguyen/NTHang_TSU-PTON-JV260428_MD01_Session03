<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo table sử dụng thuộc tính colspan</title>
    <style>
    table {
        border-collapse: separate;
        border-spacing: 20px; /* khoảng cách giữa các ô */
    }

    th, td {
        border: 1px solid black;
        padding: 30px;
        font-size: 20px;
    }
</style>
</head>
<body>
    <table border="1">
    <thead>
        <tr>
            <th>Tháng</th>
            <th Colspan="2">Tỷ lệ đơn hàng theo tháng</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>15% hoàn thành</td>
            <td>85% hủy hàng</td>
        </tr>
        <tr>
            <td>Phan Văn B</td>
            <td>25% hoàn thành</td>
            <td>75% hủy hàng</td>
        </tr>
        <tr>
            <td>Nguyễn Thị C</td>
            <td>50% hoàn thành</td>
            <td>50% hủy hàng</td>
        </tr>
    </tbody>
    </table>
</body>
</html>
