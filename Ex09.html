<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tìm kiếm và lọc sản phẩm</title>
</head>
<body>
    <h1>Tìm Kiếm Sản Phẩm</h1>
    <form action="" method="post">
        <p>
            <label for="keyword">Từ khóa tìm kiếm:</label><br>
            <input type="text" id="keyword" name="Từ khóa tìm kiếm">
        </p>

        <p>
            <label for="type">Loại sản phẩm</label>
            <select name="Loại sản phẩm" id="type">
                <option value="Điện tử">Điện tử</option>
                <option value="May mặc">May mặc</option>
                <option value="Gia dụng">Gia dụng</option>
            </select>
        </p>

        <p>
            <button>Tìm kiếm</button>
        </p>

    </form>
    
</body>
</html>
